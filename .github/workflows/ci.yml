name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Pinned: apt ships 3.1.3 (no Heading1Char/FootnoteBlockText in its
      # reference.docx) and Homebrew ships 3.11 (reads `$x$5` differently),
      # and the tests are written against what the tool is developed with.
      - name: Install pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: 3.7.0.2
      - name: Show pandoc
        run: pandoc --version | head -1
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Version consistency
        run: python scripts/check_version.py
      - name: Test
        run: pytest -q
      - name: CLI smoke test
        run: |
          gdoc-sync --version
          gdoc-sync --help
          gdoc-sync config
